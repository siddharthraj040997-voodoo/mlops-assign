# Optional alternative to the LoadBalancer (needs an ingress controller:
# `minikube addons enable ingress`). Reach it via http://heart.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
  namespace: heart-mlops
spec:
  ingressClassName: nginx
  rules:
    - host: heart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: heart-api, port: {number: 80}}
