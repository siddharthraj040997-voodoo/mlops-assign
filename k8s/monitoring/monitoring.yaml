# Prometheus + Grafana in the heart-mlops namespace. The Grafana dashboard
# ConfigMap (grafana-dashboards) is created by scripts/deploy_k8s.sh.
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: heart-mlops}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    scrape_configs:
      - job_name: heart-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - {role: pod, namespaces: {names: [heart-mlops]}}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: heart-api
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: heart-mlops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: heart-mlops}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: heart-mlops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: heart-mlops}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: heart-mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
      volumes:
        - {name: cfg, configMap: {name: prometheus-config}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: heart-mlops}
spec:
  type: ClusterIP
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasource, namespace: heart-mlops}
data:
  ds.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-provider, namespace: heart-mlops}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: heart-api
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: heart-mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dash, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: ds, configMap: {name: grafana-datasource}}
        - {name: provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dash, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: heart-mlops}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
